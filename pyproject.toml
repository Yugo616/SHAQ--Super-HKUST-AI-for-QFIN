[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shaq-daily-oracle"
version = "0.6.0"
description = "Cross-platform multi-model research workbench for governed premarket Skill experiments"
requires-python = ">=3.13"
dependencies = [
  "openai>=1.100",
  "httpx>=0.28",
  "jsonschema>=4.21",
  "pandas-market-calendars>=5.1",
  "platformdirs>=4.3",
  "filelock>=3.16",
  "zipline-reloaded==3.1.1",
  "numpy==2.3.5",
  "pandas==2.3.3",
]

[project.scripts]
daily-oracle = "shaq_daily_oracle.cli:main"
shaq-daily-oracle-desktop = "shaq_daily_oracle.desktop:main"

[project.optional-dependencies]
futu = ["futu-api>=10.10"]
test = ["jsonschema>=4.21"]
desktop = [
  "pandas>=2.2,<3.0",
  "keyring>=25.6",
  "pywebview==6.1",
  "pyinstaller==6.16.0",
  "quickjs>=1.19.4,<2.0",
  "yfinance>=0.2.65",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shaq_daily_oracle = ["desktop/*", "licenses/*"]
