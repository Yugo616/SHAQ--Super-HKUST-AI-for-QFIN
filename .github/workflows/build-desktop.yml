name: Build SHAQ Daily Oracle Lab
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-desktop.yml"
      - "packaging/**"
      - "src/**"
      - "tests/**"
      - "bundled_versions/**"
      - "config/**"
      - "skills/**"
      - "decision/**"
      - "pyproject.toml"
      - ".gitattributes"
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows-x64
          - runner: macos-15
            platform: macOS-Apple-Silicon
            arch: arm64
          - runner: macos-15-intel
            platform: macOS-Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          install: mingw-w64-x86_64-gcc
          update: false
      - name: Enable MinGW-W64 for the upstream QuickJS CPython 3.13 source build
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append'
      - name: Verify actual macOS architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build native no-LZO dependencies then install locked application
        run: python packaging/build_native.py
      - name: Validate eight Skills and all application tests
        run: |
          python scripts/validate_release.py
          python -m unittest discover -s tests -v
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - name: Install, settle both methods, reopen, inspect native window and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $InstallDir = Join-Path $env:RUNNER_TEMP "SHAQ-Lab-Acceptance"
          $Setup = Join-Path $PWD "dist\SHAQ-Daily-Oracle-Lab-Windows-x64-Setup.exe"
          $Process = Start-Process $Setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$InstallDir" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Installer failed; verify WebView2 Evergreen runtime" }
          $Executable = Join-Path $InstallDir "SHAQ Daily Oracle Lab.exe"
          $Report = Join-Path $PWD "dist\installed-smoke.json"
          $Process = Start-Process $Executable -ArgumentList "--smoke", "--smoke-output", $Report -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Installed settlement/history/reopen failed" }
          $GuiReport = Join-Path $PWD "dist\installed-gui.json"
          $Process = Start-Process $Executable -ArgumentList "--gui-smoke", $GuiReport -PassThru
          if (-not $Process.WaitForExit(60000)) { $Process.Kill(); throw "Native GUI timed out" }
          if ($Process.ExitCode -ne 0) { throw "Native GUI failed" }
          python packaging/audit_payload.py $InstallDir --output dist/installed-native-audit.json
          if ($LASTEXITCODE -ne 0) { throw "Installed payload audit failed" }
          $Process = Start-Process (Join-Path $InstallDir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($Process.ExitCode -ne 0 -or (Test-Path $Executable)) { throw "Uninstall failed" }
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: zsh packaging/build_macos.sh
      - name: Install from DMG, settle both methods, reopen and inspect native window
        if: runner.os == 'macOS'
        run: |
          MOUNT_POINT="$RUNNER_TEMP/shaq-dmg"
          INSTALL_ROOT="$RUNNER_TEMP/shaq-applications"
          mkdir -p "$MOUNT_POINT" "$INSTALL_ROOT"
          hdiutil attach -nobrowse -mountpoint "$MOUNT_POINT" "dist/SHAQ-Daily-Oracle-Lab-${{ matrix.platform }}.dmg"
          ditto "$MOUNT_POINT/SHAQ Daily Oracle Lab.app" "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app"
          hdiutil detach "$MOUNT_POINT"
          "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app/Contents/MacOS/SHAQ Daily Oracle Lab" --smoke --smoke-output "$PWD/dist/installed-smoke.json"
          python -c 'import subprocess,sys; subprocess.run(sys.argv[1:],check=True,timeout=60)' "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app/Contents/MacOS/SHAQ Daily Oracle Lab" --gui-smoke "$PWD/dist/installed-gui.json"
          codesign --verify --deep --strict "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app"
          python packaging/audit_payload.py "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app" --output dist/installed-native-audit.json
          find "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app" -depth -delete
          test ! -e "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app"
      - name: Retain installers, checksums, provenance, native sources and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHAQ-Daily-Oracle-Lab-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
            dist/*.sha256
            dist/*.json
            dist/native/*.json
            build/third-party/**
            build/license-sources/*.tar.gz
            build/native-dependencies/sources/*.tar.gz
            build/native-dependencies/wheel-sha256.json
            build/native-dependencies/wheels/*.whl
