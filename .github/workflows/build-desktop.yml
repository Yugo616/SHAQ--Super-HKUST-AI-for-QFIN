name: Build SHAQ Daily Oracle Lab

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-desktop.yml"
      - "config/**"
      - "governance/**"
      - "packaging/**"
      - "schemas/**"
      - "scripts/**"
      - "skills/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research workbench dependencies
        run: python -m pip install -e ".[desktop,test]"
      - name: Validate and test
        run: |
          python scripts/validate_release.py
          python -m unittest discover -s tests -v
      - name: Build installer
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - name: Install, smoke test, and uninstall
        shell: pwsh
        run: |
          $InstallDir = Join-Path $env:RUNNER_TEMP "SHAQ-Daily-Oracle-Lab-Test"
          $Setup = Join-Path $PWD "dist\SHAQ-Daily-Oracle-Lab-Windows-x64-Setup.exe"
          $Process = Start-Process $Setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$InstallDir" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Installer failed" }
          $Executable = Join-Path $InstallDir "SHAQ Daily Oracle Lab.exe"
          $Process = Start-Process $Executable -ArgumentList "--smoke" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Installed app smoke test failed" }
          $Uninstall = Join-Path $InstallDir "unins000.exe"
          $Process = Start-Process $Uninstall -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Uninstaller failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: SHAQ-Daily-Oracle-Lab-Windows-x64
          path: |
            dist/SHAQ-Daily-Oracle-Lab-Windows-x64-Setup.exe
            dist/SHAQ-Daily-Oracle-Lab-Windows-x64-Setup.exe.sha256

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            machine_arch: arm64
            package_arch: Apple-Silicon
          - runner: macos-15-intel
            machine_arch: x86_64
            package_arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine_arch }}"
      - name: Install research and isolated Mac operator dependencies
        run: python -m pip install -e ".[desktop,futu,test]"
      - name: Validate and test
        run: |
          python scripts/validate_release.py
          python -m unittest discover -s tests -v
      - name: Build disk image
        run: zsh packaging/build_macos.sh
      - name: Mount, smoke test, and verify temporary signature
        run: |
          MOUNT_POINT="$RUNNER_TEMP/shaq-dmg"
          INSTALL_ROOT="$RUNNER_TEMP/shaq-applications"
          DMG="dist/SHAQ-Daily-Oracle-Lab-macOS-${{ matrix.package_arch }}.dmg"
          mkdir -p "$MOUNT_POINT" "$INSTALL_ROOT"
          hdiutil attach -nobrowse -mountpoint "$MOUNT_POINT" "$DMG"
          ditto "$MOUNT_POINT/SHAQ Daily Oracle Lab.app" "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app"
          "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app/Contents/MacOS/SHAQ Daily Oracle Lab" --smoke
          codesign --verify --deep --strict "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app"
          hdiutil detach "$MOUNT_POINT"
          find "$INSTALL_ROOT/SHAQ Daily Oracle Lab.app" -depth -delete
      - uses: actions/upload-artifact@v4
        with:
          name: SHAQ-Daily-Oracle-Lab-macOS-${{ matrix.package_arch }}
          path: |
            dist/SHAQ-Daily-Oracle-Lab-macOS-${{ matrix.package_arch }}.dmg
            dist/SHAQ-Daily-Oracle-Lab-macOS-${{ matrix.package_arch }}.dmg.sha256
