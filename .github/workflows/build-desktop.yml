name: Publish accepted SHAQ platform packages
on:
  workflow_dispatch:
    inputs:
      accepted_run:
        required: true
        type: string
      accepted_source:
        required: true
        type: string
      release_version:
        required: true
        type: string
      expected_base_source:
        required: true
        type: string
      expected_versions_sha:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SHAQ-Daily-Oracle-Lab-*
          run-id: ${{ inputs.accepted_run }}
          github-token: ${{ github.token }}
          path: accepted
      - name: Verify all three accepted artifacts and publish platform releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACCEPTED_RUN: ${{ inputs.accepted_run }}
          ACCEPTED_SOURCE: ${{ inputs.accepted_source }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          EXPECTED_BASE_SOURCE: ${{ inputs.expected_base_source }}
          EXPECTED_VERSIONS_SHA: ${{ inputs.expected_versions_sha }}
        run: python packaging/publish_accepted.py
