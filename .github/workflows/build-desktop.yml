name: Stage already accepted SHAQ installers
on:
  workflow_dispatch:
    inputs:
      application_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      windows_run:
        required: true
        type: string
      arm_run:
        required: true
        type: string
      intel_run:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SHAQ_APPLICATION_SHA: ${{ inputs.application_sha }}
      SHAQ_RELEASE_VERSION: ${{ inputs.version }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
      ARM_RUN: ${{ inputs.arm_run }}
      INTEL_RUN: ${{ inputs.intel_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.application_sha }}
          path: application
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify native job provenance and stage existing packages without rebuilding
        run: python packaging/publish_accepted_drafts.py
