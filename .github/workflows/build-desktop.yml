name: Publish accepted macOS artifacts
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SHAQ-Daily-Oracle-Lab-macOS-*
          run-id: 34486634455
          github-token: ${{ github.token }}
          path: accepted
      - name: Verify original accepted files and prepare required notices
        run: python packaging/publish_accepted_macos.py
      - name: Publish two native DMGs, checksums and sources without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lab-v0.6.0-macos --target 84dc32c4901ccadab53372ee526186d44786d83c --prerelease --title 'SHAQ Daily Oracle Lab 0.6.0 · macOS' --notes-file packaging/macos-release-notes.md release/*
