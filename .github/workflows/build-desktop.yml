name: Inspect existing Windows payload
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SHAQ-Daily-Oracle-Lab-Windows-x64
          run-id: 34480684368
          github-token: ${{ github.token }}
          path: prior
      - name: Inspect existing installer without rebuilding
        shell: pwsh
        run: |
          $exe = Get-ChildItem prior -Recurse -Filter '*Setup.exe' | Select-Object -First 1
          if (!$exe) { throw 'Missing diagnostic installer' }
          $root = Join-Path $env:RUNNER_TEMP 'shaq-inspect'
          try {
            $p = Start-Process $exe.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$root`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Install failed $($p.ExitCode)" }
            python packaging/inspect_existing_payload.py "$root" inventory.json
            if ($LASTEXITCODE -ne 0) { throw 'Inventory failed' }
          } finally {
            $uninstaller = Join-Path $root 'unins000.exe'
            if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-windows-inventory
          path: inventory.json
