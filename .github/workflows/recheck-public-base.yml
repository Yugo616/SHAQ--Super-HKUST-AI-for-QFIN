name: Recheck immutable Mac public-base update
on:
  workflow_call:
    inputs:
      run_id: {required: true, type: string}
      artifact_id: {required: true, type: string}
      job_id: {required: true, type: string}
      application_sha: {required: true, type: string}
      version: {required: true, type: string}
      platform: {required: true, type: string}
permissions:
  actions: read
  contents: read
jobs:
  recheck:
    runs-on: ${{ inputs.platform == 'macOS-Apple-Silicon' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id }}
      SOURCE_ARTIFACT: ${{ inputs.artifact_id }}
      SOURCE_JOB: ${{ inputs.job_id }}
      SOURCE_SHA: ${{ inputs.application_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      TARGET_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify frozen source and the single failed acceptance gate
        run: |
          mkdir -p recheck-metadata
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > recheck-metadata/run.json
          gh api "repos/$GH_REPO/actions/jobs/$SOURCE_JOB" > recheck-metadata/job.json
          gh api "repos/$GH_REPO/actions/artifacts/$SOURCE_ARTIFACT" > recheck-metadata/artifact.json
          python packaging/native_recheck_source.py --metadata recheck-metadata --run-id "$SOURCE_RUN" --job-id "$SOURCE_JOB" --artifact-id "$SOURCE_ARTIFACT" --application-sha "$SOURCE_SHA" --platform "$TARGET_PLATFORM"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.application_sha }}
          path: application
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          merge-multiple: true
          path: native-artifact
      - name: Verify the immutable artifact source identity
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          e=os.environ
          meta=json.loads(Path('native-artifact/build/third-party/manifest.json').read_text())
          assert meta['source_sha']==e['SOURCE_SHA'] and not meta['source_dirty']
          assert meta['source_version']==e['RELEASE_VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+',e['RELEASE_VERSION'])
          assert subprocess.check_output(['git','-C','application','rev-parse','HEAD'],text=True).strip()==e['SOURCE_SHA']
          PY
      - name: Install only the locked recheck harness dependencies
        run: python -m pip install --constraint application/packaging/requirements.lock.txt httpx packaging platformdirs filelock
      - name: Run unchanged public-base native acceptance and preserve process diagnostics
        env:
          PYTHONPATH: ${{ github.workspace }}/application/src
          SHAQ_BUILD_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess, sys, tempfile
          from pathlib import Path
          output=Path('recheck-result');output.mkdir()
          temporary=Path(tempfile.gettempdir())
          before=set(temporary.glob('shaq-installed-update-*'))
          code=2
          try:
              with (output/'acceptance.log').open('w') as stream:
                  result=subprocess.run([sys.executable,'application/packaging/public_base_update_acceptance.py','--feed','native-artifact/dist/update-feed','--target-version',os.environ['RELEASE_VERSION'],'--output',str(output/'public-base-update.json')],stdout=stream,stderr=subprocess.STDOUT,timeout=720)
                  code=result.returncode
          except subprocess.TimeoutExpired:
              (output/'harness-error.json').write_text(json.dumps({'status':'failed','error':'Public-base harness exceeded its bounded timeout'}))
          for number, root in enumerate(sorted(set(temporary.glob('shaq-installed-update-*'))-before)):
              events=root/'events-public-base'
              if not events.is_dir(): continue
              diagnostic=output/f'events-{number}'
              shutil.copytree(events,diagnostic)
              shutil.copy2(root/'acceptance.json',diagnostic/'acceptance.json')
              health=events/'target-health.json'
              if code and health.is_file():
                  pid=json.loads(health.read_text()).get('pid')
                  if type(pid) is int and pid>0:
                      with (diagnostic/'process.txt').open('w') as stream:
                          subprocess.run(['ps','-p',str(pid),'-o','pid,ppid,stat,etime,command'],stdout=stream,stderr=subprocess.STDOUT)
                      subprocess.run(['sample',str(pid),'2','-file',str(diagnostic/'target-sample.txt')],timeout=15,check=False)
          report=output/'public-base-update.json'
          if report.is_file(): print(report.read_text())
          if subprocess.check_output(['git','-C','application','status','--porcelain']):
              raise RuntimeError('The frozen application source changed during acceptance')
          sys.exit(code)
          PY
      - name: Retain recheck identity, events and acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-base-recheck-${{ inputs.platform }}
          path: |
            recheck-metadata/**
            recheck-result/**
